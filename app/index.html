<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AirAware VN</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f4f7f5; color: #17211c; }
    body { margin: 0; }
    main { width: min(44rem, calc(100% - 2rem)); margin: 0 auto; padding: 3rem 0; }
    header { border-bottom: 1px solid #cbd7d0; padding-bottom: 1.5rem; }
    h1 { margin: 0; font-size: 2rem; }
    .subtitle { color: #4b6155; margin: .5rem 0 0; }
    #forecast { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; margin-top: 1.5rem; }
    section { background: #fff; border: 1px solid #cbd7d0; padding: 1.25rem; }
    h2 { margin: 0 0 .5rem; font-size: 1rem; color: #4b6155; }
    .value { margin: 0; font-size: 2rem; font-weight: 700; }
    .note { margin: .5rem 0 0; color: #4b6155; }
    .change { margin: .5rem 0 0; font-size: 1.05rem; }
    .full { grid-column: 1 / -1; }
    #status { min-height: 1.5rem; margin: 1.5rem 0 0; }
    button { margin-top: 1.5rem; border: 0; background: #176b45; color: white; padding: .75rem 1rem; font: inherit; font-weight: 700; cursor: pointer; }
    button:focus-visible { outline: 3px solid #17211c; outline-offset: 3px; }
    button:disabled { cursor: wait; opacity: .65; }
    @media (max-width: 32rem) { #forecast { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>AirAware VN</h1>
      <p class="subtitle">Live 6-hour PM2.5 forecast for Hanoi.</p>
    </header>

    <div id="forecast" aria-busy="true">
      <section aria-labelledby="latest-title">
        <h2 id="latest-title">Latest PM2.5</h2>
        <p class="value"><span id="latest-pm25">—</span> <small>µg/m³</small></p>
        <p id="observed-time" class="note">Observed: —</p>
      </section>

      <section aria-labelledby="forecast-title">
        <h2 id="forecast-title">6-hour-ahead forecast</h2>
        <p class="value"><span id="forecast-pm25">—</span> <small>µg/m³</small></p>
        <p id="target-window" class="note">Expected: —</p>
      </section>

      <section class="full" aria-labelledby="change-title">
        <h2 id="change-title">Expected change</h2>
        <p id="expected-change" class="change">No forecast yet.</p>
      </section>

      <section class="full" aria-labelledby="freshness-title">
        <h2 id="freshness-title">Data freshness</h2>
        <p id="freshness" class="note">Unavailable.</p>
      </section>
    </div>

    <p id="status" role="status" aria-live="polite" tabindex="-1">Loading forecast…</p>
    <button id="refresh" type="button" aria-label="Refresh forecast">Refresh forecast</button>
  </main>

  <script>
    (function (root) {
      "use strict";
      var ICT_TIME_ZONE = "Asia/Ho_Chi_Minh";
      var timeFormatter = new Intl.DateTimeFormat("en-GB", {
        timeZone: ICT_TIME_ZONE,
        year: "numeric",
        month: "short",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
      });

      function formatIct(value) {
        var date = new Date(value);
        if (Number.isNaN(date.getTime())) return "Unavailable";
        return timeFormatter.format(date) + " ICT";
      }

      function finiteValue(value) {
        if (typeof value === "number") return Number.isFinite(value) ? value : NaN;
        if (typeof value === "string" && value.trim() !== "") {
          var parsed = Number(value);
          return Number.isFinite(parsed) ? parsed : NaN;
        }
        return NaN;
      }

      function timestamp(value) {
        if (value === null || value === undefined || value === "") return NaN;
        var date = new Date(value);
        return Number.isNaN(date.getTime()) ? NaN : date.getTime();
      }

      function buildModel(data) {
        var source = data && typeof data === "object" ? data : {};
        var latest = finiteValue(source.latest_completed_pm25);
        var predicted = finiteValue(source.predicted_pm25);
        if (!Number.isFinite(latest) || !Number.isFinite(predicted)) {
          return { ok: false, reason: "invalid_pm25" };
        }
        var start = timestamp(source.target_interval_start);
        var end = timestamp(source.target_interval_end);
        if (Number.isNaN(start) || Number.isNaN(end)) {
          return { ok: false, reason: "invalid_target" };
        }
        var observed = timestamp(source.history_end);
        if (Number.isNaN(observed)) {
          return { ok: false, reason: "invalid_history_end" };
        }
        var stale = source.freshness_status === "stale";
        var age = finiteValue(source.age_minutes);
        if (!stale && !Number.isFinite(age)) {
          return { ok: false, reason: "invalid_age" };
        }
        return {
          ok: true,
          model: {
            latest: latest,
            predicted: predicted,
            start: start,
            end: end,
            observed: observed,
            stale: stale,
            age: Number.isFinite(age) ? age : NaN,
            horizonHours: 6,
          },
        };
      }

      function changeText(model) {
        var delta = model.predicted - model.latest;
        var rounded = Math.abs(delta).toFixed(1);
        if (parseFloat(rounded) === 0) {
          return "No meaningful change from the latest reading";
        }
        if (delta > 0) {
          return "↑ About " + rounded + " µg/m³ higher than the latest reading";
        }
        return "↓ About " + rounded + " µg/m³ lower than the latest reading";
      }

      function observedText(model) {
        return "Observed " + formatIct(model.observed);
      }

      function expectedText(model) {
        return "Expected " + formatIct(model.start) + " – " + formatIct(model.end);
      }

      function freshnessText(model) {
        if (model.stale) return "Data may be out of date.";
        if (!Number.isFinite(model.age)) return "Updated time unknown";
        return "Updated " + Math.max(0, Math.round(model.age)) + " minutes ago";
      }

      root.AirAwareView = {
        formatIct: formatIct,
        buildModel: buildModel,
        changeText: changeText,
        observedText: observedText,
        expectedText: expectedText,
        freshnessText: freshnessText,
        ICT_TIME_ZONE: ICT_TIME_ZONE,
        HORIZON_HOURS: 6,
      };
    })(typeof globalThis !== "undefined" ? globalThis : this);
  </script>

  <script>
    (function () {
      var view = window.AirAwareView;
      var statusEl = document.querySelector("#status");
      var forecastEl = document.querySelector("#forecast");
      var refreshEl = document.querySelector("#refresh");
      var latestEl = document.querySelector("#latest-pm25");
      var observedEl = document.querySelector("#observed-time");
      var forecastValEl = document.querySelector("#forecast-pm25");
      var targetEl = document.querySelector("#target-window");
      var changeEl = document.querySelector("#expected-change");
      var freshnessEl = document.querySelector("#freshness");

      var state = "loading";
      var hasValidPrior = false;

      function setBusy(busy) {
        forecastEl.setAttribute("aria-busy", busy ? "true" : "false");
        refreshEl.disabled = busy;
      }

      function showLoading() {
        state = "loading";
        setBusy(true);
        statusEl.textContent = hasValidPrior ? "Refreshing forecast…" : "Loading forecast…";
      }

      function applyModel(model) {
        var render = {
          latest: model.latest.toFixed(1),
          forecast: model.predicted.toFixed(1),
          change: view.changeText(model),
          observed: view.observedText(model),
          expected: view.expectedText(model),
          freshness: view.freshnessText(model),
        };
        latestEl.textContent = render.latest;
        forecastValEl.textContent = render.forecast;
        changeEl.textContent = render.change;
        observedEl.textContent = render.observed;
        targetEl.textContent = render.expected;
        freshnessEl.textContent = render.freshness;
        hasValidPrior = true;
        state = "available";
        setBusy(false);
        statusEl.textContent = "Forecast updated.";
      }

      function showUnavailable() {
        if (hasValidPrior) {
          freshnessEl.textContent = "Data may be out of date.";
          statusEl.textContent = "Forecast unavailable right now. Showing the most recent forecast we have.";
        } else {
          latestEl.textContent = "Unavailable";
          observedEl.textContent = "Unavailable";
          forecastValEl.textContent = "Unavailable";
          targetEl.textContent = "Unavailable";
          changeEl.textContent = "Forecast unavailable right now.";
          freshnessEl.textContent = "Unavailable";
          statusEl.textContent = "Forecast unavailable right now.";
        }
        state = "unavailable";
        setBusy(false);
      }

      async function loadForecast() {
        showLoading();
        try {
          var response = await fetch("/forecast/current");
          if (!response.ok) throw new Error("Forecast unavailable right now");
          var payload = await response.json();
          var result = view.buildModel(payload);
          if (!result.ok) throw new Error("Forecast unavailable right now");
          applyModel(result.model);
        } catch (error) {
          showUnavailable();
          statusEl.focus();
        }
      }

      refreshEl.addEventListener("click", loadForecast);
      window.AirAwareDom = { loadForecast: loadForecast };
      loadForecast();
    })();
  </script>
</body>
</html>
